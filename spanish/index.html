<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ターゲット1200 スペイン語版 (暗記チェック・発音付き・DELE対策)</title>
<style>
:root {
  --primary: #c0392b;
  --secondary: #2980b9;
  --accent: #059669;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text: #1e293b;
  --border: #e2e8f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.4;
  padding: 10px 6px;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
}
header {
  text-align: center;
  margin-bottom: 10px;
}
h1 {
  color: var(--primary);
  font-size: 1.4rem;
  margin-bottom: 3px;
}
.subtitle {
  color: #64748b;
  font-size: 0.8rem;
}
.controls {
  background: var(--card-bg);
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.search-box input {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.92rem;
  outline: none;
}
.search-box input:focus {
  border-color: var(--primary);
}
.part-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.part-select {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: white;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text);
  outline: none;
  cursor: pointer;
  flex: 1 1 180px;
}
.btn-quick-all {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
}
.btn-quick-all.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.filter-pills {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 2px;
  -webkit-overflow-scrolling: touch;
}
.pill {
  padding: 4px 8px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 4px;
  font-size: 0.75rem;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.pill.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.progress-card {
  background: #f1f5f9;
  padding: 8px 12px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
}
.progress-bar-bg {
  width: 100%;
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease;
}
.meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 0.82rem;
}
.mask-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #f1f5f9;
  padding: 4px 8px;
  border-radius: 6px;
  flex-wrap: wrap;
}
.mask-controls label {
  display: flex;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  font-size: 0.8rem;
}
.filter-learned-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  font-weight: 600;
  color: var(--secondary);
}
.btn-reset-learned {
  padding: 2px 6px;
  background: #fee2e2;
  color: #b91c1c;
  border: 1px solid #fca5a5;
  border-radius: 4px;
  font-size: 0.72rem;
  cursor: pointer;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card-bg);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
th, td {
  padding: 8px 6px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
th {
  background: #1e293b;
  color: white;
  font-weight: 600;
  font-size: 0.82rem;
  position: sticky;
  top: 0;
  z-index: 10;
}
tr:hover {
  background: #f8fafc;
}
tr.is-learned {
  background-color: #f0fdf4 !important;
  opacity: 0.65;
}
tr.is-learned .es-word {
  color: #166534;
}
.col-check {
  width: 32px;
  text-align: center;
  padding: 8px 4px;
}
.check-box {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: var(--accent);
}
.col-es {
  width: 38%;
}
.es-word {
  font-weight: 700;
  color: var(--primary);
  font-size: 0.98rem;
  line-height: 1.25;
}
.es-no {
  color: #94a3b8;
  font-size: 0.78rem;
  font-weight: 600;
  margin-right: 3px;
}
.pos-badge {
  font-size: 0.75rem;
  font-weight: 600;
  color: #64748b;
  margin-left: 3px;
}
.es-pron {
  color: var(--accent);
  font-size: 0.8rem;
  margin-top: 2px;
}
.es-pron b {
  color: inherit;
  font-weight: 700;
}
.col-ja-en {
  width: 30%;
}
.ja-word {
  font-weight: 600;
  color: #1e293b;
  font-size: 0.92rem;
  line-height: 1.25;
}
.en-word {
  color: #64748b;
  font-size: 0.78rem;
  margin-top: 2px;
}
.col-note {
  width: 28%;
  color: var(--secondary);
  font-size: 0.78rem;
  line-height: 1.35;
}
.mask {
  background: #cbd5e1;
  color: transparent !important;
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
}
.mask * {
  color: transparent !important;
}
.mask:hover, .mask.revealed {
  background: transparent !important;
  color: inherit !important;
}
.mask.revealed * {
  color: inherit !important;
}
@media (max-width: 600px) {
  body { padding: 4px 2px; }
  h1 { font-size: 1.2rem; }
  .col-check { width: 28px; }
  .col-es { width: 40%; }
  .col-ja-en { width: 30%; }
  .col-note { width: 26%; font-size: 0.74rem; }
  th, td { padding: 6px 4px; }
  .es-word { font-size: 0.88rem; }
  .es-pron { font-size: 0.74rem; }
  .ja-word { font-size: 0.84rem; }
  .en-word { font-size: 0.7rem; }
}
</style>
</head>

      <div class="stats" id="statsDisplay">表示中: 1700語</div>

  </div>

  <table id="vocabTable">

as generales", "pronunciation": "エン・コン<b>フン</b>ト / エン・<b>リ</b>ネアス・ヘネ<b>ラ</b>レス", "ja": "全体的に見て", "en": "on the whole", "pos": "loc.", "pos_ja": "(熟)", "note": "a grandes rasgos (全体的に見て)"}, {"no": 1684, "part": 17, "es": "por ejemplo", "pronunciation": "ポル・エ<b>ヘン</b>プロ", "ja": "例えば", "en": "for example [instance]", "pos": "loc.", "pos_ja": "(熟)", "note": "p. ej. (例えば)"}, {"no": 1685, "part": 17, "es": "en particular / en especial", "pronunciation": "エン・パルティク<b>ラル</b> / エン・エスペ<b>シアル</b>", "ja": "特に，とりわけ", "en": "in particular", "pos": "loc.", "pos_ja": "(熟)", "note": "sobre todo (特に、とりわけ)"}, {"no": 1686, "part": 17, "es": "es decir / o sea", "pronunciation": "<b>エス</b>・デ<b>シル</b> / オ・<b>セ</b>ア", "ja": "すなわち，より正確に言えば", "en": "that is (to say)", "pos": "loc.", "pos_ja": "(熟)", "note": "dicho de otro modo (言い換えれば [DELE作文必須！])"}, {"no": 1687, "part": 17, "es": "en otras palabras / dicho de otra forma", "pronunciation": "エン・<b>オ</b>トラス・パ<b>ラ</b>ブラス / <b>ディ</b>チョ・デ・<b>オ</b>トラ・<b>フォル</b>マ", "ja": "言い換えると，つまり", "en": "in other words", "pos": "loc.", "pos_ja": "(熟)", "note": "en resumen (要約すると、手短に言えば)"}, {"no": 1688, "part": 17, "es": "para empezar / en primer lugar", "pronunciation": "<b>パ</b>ラ・エンペ<b>サル</b> / エン・プリ<b>メル</b>・ル<b>ガル</b>", "ja": "まず第一に", "en": "to begin [start] with", "pos": "loc.", "pos_ja": "(熟)", "note": "de entrada (まず第一に、初めに)"}, {"no": 1689, "part": 17, "es": "en primer lugar / primeramente", "pronunciation": "エン・プリ<b>メル</b>・ル<b>ガル</b> / プリメラ<b>メン</b>テ", "ja": "まず第一に", "en": "in the first place", "pos": "loc.", "pos_ja": "(熟)", "note": "primero de todo (まず第一に)"}, {"no": 1690, "part": 17, "es": "además / por otra parte", "pronunciation": "アデ<b>マス</b> / ポル・<b>オ</b>トラ・<b>パル</b>テ", "ja": "その上，さらに", "en": "in addition", "pos": "loc.", "pos_ja": "(熟)", "note": "asimismo (同様に、その上)"}, {"no": 1691, "part": 17, "es": "tanto A como B / así como", "pronunciation": "<b>タン</b>ト・A・<b>コ</b>モ・B / ア<b>シ</b>・<b>コ</b>モ", "ja": "BだけでなくAも", "en": "A as well as B", "pos": "loc.", "pos_ja": "(熟)", "note": "el profesor así como los alumnos (生徒たちだけでなく先生も)"}, {"no": 1692, "part": 17, "es": "por otro lado / en cambio", "pronunciation": "ポル・<b>オ</b>トロ・<b>ラ</b>ド / エン・<b>カン</b>ビオ", "ja": "他方では", "en": "on the other hand", "pos": "loc.", "pos_ja": "(熟)", "note": "por otra parte (対比の基本！)"}, {"no": 1693, "part": 17, "es": "a pesar de (que)", "pronunciation": "a・ペ<b>サル</b>・デ (ケ)", "ja": "〜にもかかわらず", "en": "in spite of", "pos": "loc.", "pos_ja": "(熟)", "note": "a pesar del mal tiempo (悪天候にもかかわらず)"}, {"no": 1694, "part": 17, "es": "a causa de / debido a", "pronunciation": "a・<b>カウ</b>サ・デ / デ<b>ビ</b>ド・a", "ja": "〜のために，〜が原因で", "en": "because of", "pos": "loc.", "pos_ja": "(熟)", "note": "a causa de la lluvia (雨のために、雨が原因で)"}, {"no": 1695, "part": 17, "es": "por motivo de / a causa de", "pronunciation": "ポル・モ<b>ティ</b>ボ・デ / a・<b>カウ</b>サ・デ", "ja": "〜のために，〜が原因で", "en": "on account of", "pos": "loc.", "pos_ja": "(熟)", "note": "por motivos de salud (健康上の理由で)"}, {"no": 1696, "part": 17, "es": "debido a / gracias a", "pronunciation": "デ<b>ビ</b>ド・a / <b>グラ</b>シアス・a", "ja": "〜のために，〜が原因で", "en": "due to", "pos": "loc.", "pos_ja": "(熟)", "note": "debido a un error técnico (技術的エラーのために)"}, {"no": 1697, "part": 17, "es": "gracias a", "pronunciation": "<b>グラ</b>シアス・a", "ja": "〜のおかげで", "en": "thanks to", "pos": "loc.", "pos_ja": "(熟)", "note": "gracias a tu ayuda (君の助けのおかげで)"}, {"no": 1698, "part": 17, "es": "como resultado / por tanto", "pronunciation": "<b>コ</b>モ・レスル<b>タ</b>ド / ポル・<b>タン</b>ト", "ja": "結果として", "en": "as a result", "pos": "loc.", "pos_ja": "(熟)", "note": "en consecuencia (結果として、したがって)"}, {"no": 1699, "part": 17, "es": "en cualquier caso / de todas formas", "pronunciation": "エン・クアル<b>キエル</b>・<b>カ</b>ソ / デ・<b>ト</b>ダス・<b>フォル</b>マス", "ja": "いずれにしても", "en": "in any case [event]", "pos": "loc.", "pos_ja": "(熟)", "note": "sea como sea (いずれにしても、何としても)"}, {"no": 1700, "part": 17, "es": "en resumen / en pocas palabras", "pronunciation": "エン・レ<b>スー</b>メン / エン・<b>ポ</b>カス・パ<b>ラ</b>ブラス", "ja": "要約すると，手短にいうと", "en": "in short", "pos": "loc.", "pos_ja": "(熟)", "note": "en suma (要するに、結論として [DELE必修表現！])"}];

let currentPart = 'all';
let searchQuery = '';
let maskEsActive = false;
let maskJaActive = false;
let maskNoteActive = false;
let hideLearnedActive = false;

// Load learned from localStorage
let learnedSet = new Set();
try {
  const saved = localStorage.getItem('target1200_learned_list');
  if (saved) {
    learnedSet = new Set(JSON.parse(saved));
  }
} catch (e) {
  console.warn('localStorage error', e);
}

const tableBody = document.getElementById('tableBody');
const searchInput = document.getElementById('searchInput');
const partSelect = document.getElementById('partSelect');
const btnAll = document.getElementById('btnAll');
const pillsGroup = document.getElementById('pillsGroup');
const statsDisplay = document.getElementById('statsDisplay');

const maskEsCheck = document.getElementById('maskEs');
const maskJaCheck = document.getElementById('maskJa');
const maskNoteCheck = document.getElementById('maskNote');
const hideLearnedCheck = document.getElementById('hideLearned');
const btnResetLearned = document.getElementById('btnResetLearned');
const learnedStatsText = document.getElementById('learnedStatsText');
const progressBarFill = document.getElementById('progressBarFill');

function saveLearned() {
  try {
    localStorage.setItem('target1200_learned_list', JSON.stringify(Array.from(learnedSet)));
  } catch (e) {}
  updateProgressBar();
}

function updateProgressBar() {
  const count = learnedSet.size;
  const pct = ((count / 1700) * 100).toFixed(1);
  learnedStatsText.textContent = `覚えた語数: ${count} / 1700 (${pct}%)`;
  progressBarFill.style.width = `${pct}%`;
}

function syncPartUI(part) {
  currentPart = part;
  partSelect.value = part;
  if (part === 'all') {
    btnAll.classList.add('active');
  } else {
    btnAll.classList.remove('active');
  }
  pillsGroup.querySelectorAll('.pill').forEach(pill => {
    if (pill.dataset.part === part) {
      pill.classList.add('active');
      pill.scrollIntoView({ behavior: 'smooth', inline: 'nearest' });
    } else {
      pill.classList.remove('active');
    }
  });
  renderTable();
}

function renderTable() {
  const q = searchQuery.toLowerCase().trim();
  
  const filtered = rawData.filter(item => {
    // Hide learned filter
    if (hideLearnedActive && learnedSet.has(item.no)) {
      return false;
    }
    // Part filter
    if (currentPart !== 'all') {
      const p = parseInt(currentPart);
      const start = (p - 1) * 100 + 1;
      const end = Math.min(p * 100, 1700);
      if (item.no < start || item.no > end) return false;
    }
    // Search query
    if (q) {
      const matchNo = item.no.toString() === q;
      const matchEn = item.en.toLowerCase().includes(q);
      const matchEs = item.es.toLowerCase().includes(q);
      const matchJa = item.ja.includes(q);
      const matchNote = item.note.toLowerCase().includes(q);
      return matchNo || matchEn || matchEs || matchJa || matchNote;
    }
    return true;
  });

  statsDisplay.textContent = `表示中: ${filtered.length} / 1700語`;

  let html = '';
  filtered.forEach(item => {
    const isLearned = learnedSet.has(item.no);
    const learnedClass = isLearned ? 'is-learned' : '';
    const checkedAttr = isLearned ? 'checked' : '';
    
    const esMaskClass = maskEsActive ? 'mask' : '';
    const jaMaskClass = maskJaActive ? 'mask' : '';
    const noteMaskClass = maskNoteActive ? 'mask' : '';
    const posTag = item.pos_ja ? `<span class="pos-badge">${item.pos_ja}</span>` : '';
    
    html += `<tr class="${learnedClass}" id="row-${item.no}">
      <td class="col-check">
        <input type="checkbox" class="check-box" data-no="${item.no}" ${checkedAttr} onchange="toggleLearned(${item.no}, this.checked)">
      </td>
      <td class="col-es ${esMaskClass}" onclick="this.classList.toggle('revealed')">
        <div class="es-word"><span class="es-no">#${item.no}</span>${item.es} ${posTag}</div>
        <div class="es-pron">(${item.pronunciation})</div>
      </td>
      <td class="col-ja-en ${jaMaskClass}" onclick="this.classList.toggle('revealed')">
        <div class="ja-word">${item.ja}</div>
        <div class="en-word">${item.en}</div>
      </td>
      <td class="col-note ${noteMaskClass}" onclick="this.classList.toggle('revealed')">
        ${item.note}
      </td>
    </tr>`;
  });

  tableBody.innerHTML = html;
}

window.toggleLearned = function(no, isChecked) {
  if (isChecked) {
    learnedSet.add(no);
  } else {
    learnedSet.delete(no);
  }
  saveLearned();
  
  const row = document.getElementById(`row-${no}`);
  if (row) {
    if (isChecked) {
      row.classList.add('is-learned');
      if (hideLearnedActive) {
        row.style.display = 'none';
      }
    } else {
      row.classList.remove('is-learned');
    }
  }
};

searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderTable();
});

partSelect.addEventListener('change', (e) => {
  syncPartUI(e.target.value);
});

btnAll.addEventListener('click', () => {
  syncPartUI('all');
});

pillsGroup.addEventListener('click', (e) => {
  if (e.target.classList.contains('pill')) {
    syncPartUI(e.target.dataset.part);
  }
});

maskEsCheck.addEventListener('change', (e) => {
  maskEsActive = e.target.checked;
  renderTable();
});

maskJaCheck.addEventListener('change', (e) => {
  maskJaActive = e.target.checked;
  renderTable();
});

maskNoteCheck.addEventListener('change', (e) => {
  maskNoteActive = e.target.checked;
  renderTable();
});

hideLearnedCheck.addEventListener('change', (e) => {
  hideLearnedActive = e.target.checked;
  renderTable();
});

btnResetLearned.addEventListener('click', () => {
  if (confirm('覚えた単語のチェックをすべてリセットしますか？')) {
    learnedSet.clear();
    saveLearned();
    renderTable();
  }
});

updateProgressBar();
renderTable();
</script>
</body>
</html>
